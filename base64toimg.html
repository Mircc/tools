<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片 Base64 转换工具 - 安全工具箱</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
            --danger: #ef4444;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            line-height: 1.6;
        }

        /* --- 导航栏 --- */
        .navbar {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            height: 64px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            text-decoration: none;
        }
        .nav-links { display: flex; gap: 20px; }
        .nav-link {
            text-decoration: none;
            color: var(--text-sub);
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .nav-link:hover { color: var(--primary); }
        .nav-link.active { color: var(--primary); font-weight: 600; }
        @media (max-width: 768px) { .nav-links { display: none; } }

        /* --- 主布局 --- */
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        
        h1 { 
            color: var(--header-color); 
            text-align: center; 
            margin-bottom: 30px; 
            font-size: 2rem; 
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 1px solid #fff;
        }

        h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* 上传区域 */
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background-color: #f9fafb;
            position: relative;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--primary);
            background-color: #eff6ff;
            color: var(--primary);
        }
        .upload-zone input[type="file"] {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer;
        }
        .upload-icon { font-size: 32px; display: block; margin-bottom: 10px; }

        /* 文本框 */
        textarea {
            width: 100%; min-height: 120px; padding: 15px;
            border: 2px solid var(--border); border-radius: 12px;
            font-size: 14px; font-family: monospace; box-sizing: border-box;
            resize: vertical; background: #f8fafc;
            transition: all 0.2s;
        }
        textarea:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        textarea[readonly] { cursor: pointer; }

        /* 按钮 */
        .btn-primary {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
            font-size: 1rem; background: var(--primary); color: white;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }

        /* 预览区 */
        .preview-box {
            margin-top: 20px;
            text-align: center;
            background: repeating-linear-gradient(45deg, #f1f5f9 0, #f1f5f9 10px, #fff 10px, #fff 20px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            min-height: 100px;
            display: flex; justify-content: center; align-items: center;
        }
        .preview-box img { max-width: 100%; max-height: 400px; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; }
        .empty-preview { color: #94a3b8; font-size: 0.9em; }

        .status-msg { 
            margin-top: 10px; font-size: 0.9em; min-height: 1.5em; font-weight: 500; 
        }
        .text-success { color: var(--success); }
        .text-error { color: var(--danger); }

        .tips {
            font-size: 0.9em; color: #64748b; background: #eff6ff;
            padding: 12px; border-radius: 8px; margin-bottom: 20px;
            border-left: 4px solid var(--primary);
        }
        footer { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-top: 40px; }
    </style>
</head>
<body data-i18n-title-key="base64img.title">

<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="nav-logo"><span data-i18n="nav.logo">🛡️ 安全工具箱</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-link" data-i18n="nav.home">首页</a>
            <a href="watermark.html" class="nav-link" data-i18n="nav.watermark">在线水印</a>
            <a href="dns.html" class="nav-link" data-i18n="nav.dns">DNS查询</a>
            <a href="base64.html" class="nav-link" data-i18n="nav.base64">Base64</a>
            <a href="fingerprint.html" class="nav-link" data-i18n="nav.fingerprint">指纹检测</a>
            <a href="qr-tool.html" class="nav-link" data-i18n="nav.qrcode">二维码</a>
            <a href="tools.html" class="nav-link" data-i18n="nav.allTools">全部工具</a>
        </div>
    </div>
</nav>

<div class="container">
    <h1 data-i18n="base64img.h1">图片 Base64 转换工具</h1>

    <div class="card">
        <h3 data-i18n="base64img.sec1">📤 图片转 Base64</h3>
        <div class="upload-zone" id="dropZone">
            <input type="file" id="fileInput" accept="image/*">
            <span class="upload-icon">🖼️</span>
            <span data-i18n="base64img.uploadHint">点击上传或将图片拖拽至此</span>
        </div>
        
        <div style="margin-top: 20px;">
            <label style="display:block; margin-bottom:8px; font-weight:600; font-size:0.9em;" data-i18n="base64img.resultLabel">转换结果 (Data URI)</label>
            <textarea id="imgOutputText" readonly data-i18n-placeholder="base64img.resultPh" placeholder="图片 Base64 编码将显示在这里... (双击复制)" title="双击复制"></textarea>
            <div id="imgStatus" class="status-msg"></div>
        </div>
    </div>

    <div class="card">
        <h3 data-i18n="base64img.sec2">📥 Base64 转图片预览</h3>
        <div class="tips" data-i18n="base64img.tip">
            💡 提示：粘贴 Base64 字符串到下方，点击转换(或按 Enter)即可还原图片。
        </div>
        
        <textarea id="inputStr" placeholder="在此粘贴 data:image/png;base64,..."></textarea>
        <button class="btn-primary" id="convertBtn" data-i18n="base64img.restoreBtn">🔄 还原图片</button>
        
        <div class="preview-box">
            <span class="empty-preview" id="emptyTip" data-i18n="base64img.previewArea">图片预览区域</span>
            <img id="imgPreview" alt="Preview">
        </div>
        <div id="convertStatus" class="status-msg"></div>
    </div>

    <footer data-i18n="footer.standard">© 2026 安全工具箱 | 您的数据均在本地浏览器处理，不会上传至服务器。</footer>
</div>

<link rel="stylesheet" href="css/site-i18n.css">
<script src="js/site-i18n-strings.js"></script>
<script src="js/site-i18n-core.js"></script>
<script>
    var imgStatusState = '';
    var convertStatusState = '';
    var lastImgKb = '';
    var lastRestoreW = 0;
    var lastRestoreH = 0;

    window.onload = function() {
        // --- 元素获取 ---
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const imgOutputText = document.getElementById('imgOutputText');
        const imgStatus = document.getElementById('imgStatus');

        const inputStr = document.getElementById('inputStr');
        const convertBtn = document.getElementById('convertBtn');
        const imgPreview = document.getElementById('imgPreview');
        const emptyTip = document.getElementById('emptyTip');
        const convertStatus = document.getElementById('convertStatus');

        // --- 1. 图片转 Base64 ---
        
        // 文件选择事件
        fileInput.addEventListener('change', handleFileSelect);
        
        // 拖拽高亮效果
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect({ target: fileInput });
            }
        });

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                imgStatusState = 'errInvalidImg';
                imgStatus.textContent = SiteI18n.t('base64img.errInvalidImg');
                imgStatus.className = 'status-msg text-error';
                return;
            }

            imgStatusState = 'converting';
            imgStatus.textContent = SiteI18n.t('base64img.converting');
            imgStatus.className = 'status-msg';
            imgOutputText.value = '';

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64 = event.target.result;
                imgOutputText.value = base64;
                imgStatusState = 'convertOk';
                lastImgKb = (file.size/1024).toFixed(2);
                imgStatus.textContent = SiteI18n.t('base64img.convertOk', { kb: lastImgKb });
                imgStatus.className = 'status-msg text-success';
            };
            reader.onerror = function() {
                imgStatusState = 'errRead';
                imgStatus.textContent = SiteI18n.t('base64img.errRead');
                imgStatus.className = 'status-msg text-error';
            };
            reader.readAsDataURL(file);
        }
        
        // 双击复制功能
        imgOutputText.addEventListener('dblclick', () => {
            copyToClipboard(imgOutputText, imgStatus);
        });

        // --- 2. Base64 转图片 ---
        
        // 支持回车键直接触发
        inputStr.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault(); // 阻止换行
                convertBtn.click(); // 触发转换
            }
        });

        convertBtn.addEventListener('click', () => {
            const val = inputStr.value.trim();
            if (!val) {
                convertStatusState = 'errPasteB64';
                convertStatus.textContent = SiteI18n.t('base64img.errPasteB64');
                convertStatus.className = 'status-msg text-error';
                return;
            }

            // 简单修复：如果缺少头部，尝试补全 (假设是 png)
            let src = val;
            if (!val.startsWith('data:image') && /^[A-Za-z0-9+/=]+$/.test(val.substring(0, 50))) {
                src = 'data:image/png;base64,' + val;
            }

            imgPreview.src = src;
            imgPreview.style.display = 'block';
            emptyTip.style.display = 'none';
            
            // 监听图片加载状态
            imgPreview.onload = function() {
                convertStatusState = 'restoreOkSize';
                lastRestoreW = imgPreview.naturalWidth;
                lastRestoreH = imgPreview.naturalHeight;
                convertStatus.textContent = SiteI18n.t('base64img.restoreOkSize', {
                    w: lastRestoreW,
                    h: lastRestoreH
                });
                convertStatus.className = 'status-msg text-success';
            };
            imgPreview.onerror = function() {
                imgPreview.style.display = 'none';
                emptyTip.style.display = 'block';
                convertStatusState = 'errInvalidB64';
                convertStatus.textContent = SiteI18n.t('base64img.errInvalidB64');
                convertStatus.className = 'status-msg text-error';
            };
        });

        // --- 辅助函数 ---
        async function copyToClipboard(textarea, statusEl) {
            if (!textarea.value) return;
            try {
                textarea.select();
                await navigator.clipboard.writeText(textarea.value);
                const oldKey = imgStatusState;
                imgStatusState = 'copied';
                imgStatus.textContent = SiteI18n.t('base64img.copied');
                setTimeout(function() { refreshImgStatus(oldKey); }, 2000);
            } catch (err) {
                document.execCommand('copy');
                imgStatusState = 'selectCopy';
                imgStatus.textContent = SiteI18n.t('base64img.selectCopy');
            }
        }

        function refreshImgStatus(key, vars) {
            if (!key) return;
            imgStatus.textContent = SiteI18n.t('base64img.' + key, vars);
        }

        function refreshConvertStatus(key, vars) {
            if (!key) return;
            convertStatus.textContent = SiteI18n.t('base64img.' + key, vars);
        }

        pageI18nRefresh = function() {
            if (imgStatusState === 'convertOk' && lastImgKb) {
                refreshImgStatus('convertOk', { kb: lastImgKb });
            } else if (imgStatusState) {
                refreshImgStatus(imgStatusState);
            }
            if (convertStatusState === 'restoreOkSize' && lastRestoreW) {
                refreshConvertStatus('restoreOkSize', { w: lastRestoreW, h: lastRestoreH });
            } else if (convertStatusState) {
                refreshConvertStatus(convertStatusState);
            }
        };

        SiteI18n.init('base64img');
    };
</script>

</body>
</html>
