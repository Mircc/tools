<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="站桩">
<meta name="description" content="专业站桩 / 冥想意念计时器，去秒表专注圆环进度，大字心法口诀导引与真人太极名师身法。">
<title>站桩 · Zen Timer</title>
<style>
  :root{
    --bg-0:#050607;
    --bg-1:#0a0c0d;
    --bg-2:#14181a;
    --ink:#e9e5da;
    --ink-dim:#8d918c;
    --ink-faint:#4d514d;
    --gold:#e3c58a;
    --gold-soft:rgba(227,197,138,.14);
    --gold-glow:rgba(240,198,116,.45);
    --cyan-glow:rgba(100,200,255,.45);
    --line:rgba(255,255,255,.08);
    --card:rgba(255,255,255,.035);
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{height:100%;}

  body{
    background:
      radial-gradient(125% 110% at 50% -10%, var(--bg-2) 0%, var(--bg-1) 55%, var(--bg-0) 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
  }

  /* 呼吸光晕：仅在计时阶段出现 */
  .aura{
    position:fixed; left:50%; top:44%;
    width:min(120vw,760px); aspect-ratio:1;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(227,197,138,.10) 0%, rgba(227,197,138,.03) 38%, transparent 66%);
    opacity:0; transition:opacity 1.2s ease;
    pointer-events:none;
  }
  body.phase-run .aura{opacity:1; animation:breathe 8s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.92);}50%{transform:translate(-50%,-50%) scale(1.06);}}

  /* 气机可视化层：全屏 Canvas */
  #qi{
    position:fixed; inset:0;
    width:100%; height:100%;
    z-index:0; pointer-events:none;
    opacity:0;
    transition:opacity 1.4s ease;
  }
  body.qi-on.phase-prep   #qi,
  body.qi-on.phase-run    #qi,
  body.qi-on.phase-paused #qi{opacity:1;}
  body.qi-on .aura{opacity:0 !important; animation:none;}

  .app{
    position:relative; z-index:1;
    min-height:100dvh;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:calc(var(--safe-t) + 14px) calc(var(--safe-r) + 18px) calc(var(--safe-b) + 18px) calc(var(--safe-l) + 18px);
  }

  /* ---------- 顶栏 ---------- */
  .topbar{
    display:flex; flex-direction:column; gap:6px;
    align-items:center;
  }
  .topbar-row{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    height:36px;
  }

  /* 模式切换：抱球桩 / 打坐 */
  .mode-sel{
    display:flex; gap:2px; padding:3px;
    border:1px solid var(--line); border-radius:999px;
    background:var(--card);
    transition:opacity .3s ease;
  }
  .mode-sel button{
    padding:6px 13px; border:none; border-radius:999px;
    background:transparent; color:var(--ink-faint);
    font-size:12px; letter-spacing:.08em; cursor:pointer;
    transition:color .25s ease, background .25s ease;
  }
  .mode-sel button.on{background:rgba(255,255,255,.13); color:var(--ink);}
  .mode-sel.locked{opacity:.35; pointer-events:none;}

  /* 意念模式选择器：丹田呼吸 / 小周天 */
  .mind-sel{
    display:flex; gap:3px; padding:2px 4px;
    border:1px solid rgba(227,197,138,.16); border-radius:999px;
    background:rgba(20,24,26,.65);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:opacity .3s ease, transform .3s ease;
  }
  .mind-sel.hidden{opacity:0; pointer-events:none; transform:translateY(-4px);}
  .mind-sel button{
    padding:3px 10px; border:none; border-radius:999px;
    background:transparent; color:var(--ink-dim);
    font-size:11px; letter-spacing:.1em; cursor:pointer;
    transition:all .25s ease;
    display:inline-flex; align-items:center; gap:4px;
  }
  .mind-sel button::before{
    content:""; display:inline-block; width:5px; height:5px; border-radius:50%;
    background:currentColor; opacity:.4; transition:opacity .25s;
  }
  .mind-sel button.on{
    background:var(--gold-soft);
    color:var(--gold);
    box-shadow:0 0 10px rgba(227,197,138,.15);
  }
  .mind-sel button.on::before{opacity:1;}
  .mind-sel.locked{opacity:.4; pointer-events:none;}

  .tools{display:flex; gap:6px;}
  .icon-btn{
    width:34px; height:34px; display:grid; place-items:center;
    border:1px solid var(--line); border-radius:50%;
    background:var(--card); color:var(--ink-dim);
    font-size:14px; cursor:pointer;
    transition:color .2s, border-color .2s, background .2s, opacity .25s;
  }
  .icon-btn:active{transform:scale(.94);}
  .icon-btn.off{color:var(--ink-faint); opacity:.5;}
  .icon-btn[hidden]{display:none;}

  /* ---------- 舞台 ---------- */
  .stage{
    display:grid; place-items:center;
    position:relative;
    cursor:pointer;
  }

  .ring-wrap{
    position:relative;
    width:min(76vw,340px);
    aspect-ratio:1;
    display:grid; place-items:center;
  }
  .ring{position:absolute; inset:0; transform:rotate(-90deg);}
  .ring circle{fill:none; stroke-linecap:round;}
  .ring .track{stroke:rgba(255,255,255,.055); stroke-width:3.5;}
  .ring .prog{
    stroke:var(--gold); stroke-width:3.5;
    stroke-dasharray:879.6; stroke-dashoffset:879.6;
    filter:drop-shadow(0 0 8px rgba(227,197,138,.45));
    transition:stroke-dashoffset .12s linear;
  }
  body.phase-prep .ring .prog{stroke:#a8b0a6; filter:none;}

  /* 人形轮廓 + 气流画布 */
  .qi-figure{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:78%; height:98%;
    opacity:0;
    transition:opacity 1.2s ease;
  }
  body.qi-on .qi-figure{opacity:1;}
  .silhouette{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    transition:opacity .9s ease, transform .9s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .silhouette.off{opacity:0; transform:scale(.94) translateY(4px); pointer-events:none;}
  canvas#qi{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}

  /* ---------- 核心读数与大字口诀导引层 ---------- */
  .readout{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding:0 12px;
    transition:all .5s ease;
  }
  .label{
    font-size:12px; letter-spacing:.36em; color:var(--ink-dim);
    margin-bottom:8px; height:16px;
    transition:color .9s ease, opacity .3s;
  }

  /* 核心展示区：在未开始时显示时间，在计时运行中蜕变为【大字心法口诀】 */
  .time{
    font-size:clamp(3.8rem,18vw,7.0rem);
    font-weight:200; line-height:1.15;
    letter-spacing:-.02em;
    color:var(--ink);
    transition:opacity .35s ease, transform .35s ease, font-size .45s ease, color .5s ease;
  }

  /* 计时运行阶段：去除秒表数字，大字呈现口诀，极致专注 */
  body.phase-run .readout,
  body.phase-prep .readout,
  body.phase-paused .readout{
    justify-content:flex-start;
    padding-top:max(2px, 1.2vh);
  }

  body.phase-run .readout .time,
  body.phase-paused .readout .time{
    font-size:clamp(1.55rem, 5.8vw, 2.3rem);
    font-weight:300;
    line-height:1.35;
    letter-spacing:.12em;
    color:#f0ece1;
    text-shadow:0 0 18px rgba(227,197,138,.4);
    max-width:320px;
    margin-top:2px;
  }

  body.phase-prep .readout .time{
    font-size:clamp(2.4rem, 10vw, 3.6rem);
    font-weight:200;
    color:#cfe0d2;
    letter-spacing:.1em;
  }

  body.phase-run .readout .label,
  body.phase-paused .readout .label{
    margin:4px 0 0;
    font-size:11px;
    letter-spacing:.28em;
  }

  body.qi-on .ring .prog{
    stroke:#f3c87a;
    filter:drop-shadow(0 0 8px rgba(243,200,122,.45));
  }
  body.qi-on.mind-microcosm .ring .prog{
    stroke:#7fcdf0;
    filter:drop-shadow(0 0 8px rgba(127,205,240,.45));
  }
  body.qi-on.phase-prep .ring .prog{stroke:#a8b0a6; filter:none;}

  /* ---------- 底部面板 ---------- */
  .bottom-area{
    position:relative;
    display:flex; flex-direction:column; align-items:center;
    min-height:90px; justify-content:flex-end;
  }

  .panel{
    display:flex; flex-direction:column; align-items:center; gap:16px;
    width:100%;
    transition:opacity .4s ease, transform .4s ease;
  }
  .panel[hidden]{display:none;}

  .presets{
    display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px; width:100%; max-width:380px;
  }
  .preset{
    padding:14px 0 12px;
    border:1px solid var(--line); border-radius:14px;
    background:var(--card); color:var(--ink-dim);
    font-size:16px; font-weight:400; letter-spacing:.02em;
    cursor:pointer;
    transition:border-color .22s, color .22s, background .22s, transform .12s;
  }
  .preset small{display:block; margin-top:3px; font-size:10px; letter-spacing:.24em; color:var(--ink-faint);}
  .preset:active{transform:scale(.97);}
  .preset.on{
    border-color:rgba(227,197,138,.55);
    background:var(--gold-soft);
    color:var(--gold);
  }
  .preset.on small{color:rgba(227,197,138,.6);}

  .preset.custom{
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    cursor:text;
  }
  .preset.custom input{
    width:100%;
    padding:0; margin:0;
    border:none; outline:none; background:transparent;
    color:inherit; font-family:inherit;
    font-size:16px; font-weight:400; line-height:1.2;
    text-align:center; font-variant-numeric:tabular-nums;
    -moz-appearance:textfield; appearance:textfield;
  }
  .preset.custom input::-webkit-outer-spin-button,
  .preset.custom input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .preset.custom small{margin-top:3px;}
  .preset.custom:focus-within{
    border-color:rgba(227,197,138,.55);
    background:var(--gold-soft);
    color:var(--gold);
  }
  .preset.custom:focus-within small{color:rgba(227,197,138,.6);}

  .start{
    width:100%; max-width:380px;
    padding:16px 0;
    border:none; border-radius:16px;
    background:linear-gradient(180deg,#efe0bb,#d8b877);
    color:#1a1610; font-size:17px; font-weight:600; letter-spacing:.3em; text-indent:.3em;
    cursor:pointer;
    box-shadow:0 8px 26px -12px rgba(227,197,138,.5);
    transition:transform .12s, box-shadow .22s;
  }
  .start:active{transform:scale(.985); box-shadow:0 4px 14px -8px rgba(227,197,138,.4);}

  /* 控制按钮：沉浸式隐藏与唤出 */
  .controls-wrap{
    position:relative; width:100%; max-width:380px;
    display:flex; flex-direction:column; align-items:center;
  }
  .controls{
    display:flex; gap:14px; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transform:translateY(12px);
    transition:opacity .45s cubic-bezier(0.2,0.8,0.2,1), transform .45s cubic-bezier(0.2,0.8,0.2,1);
  }
  .controls.active,
  body.phase-paused .controls{
    opacity:1; pointer-events:auto; transform:translateY(0);
  }

  .ctrl{
    padding:12px 28px;
    border:1px solid var(--line); border-radius:999px;
    background:rgba(255,255,255,.07); color:var(--ink-dim);
    font-size:14px; letter-spacing:.16em; cursor:pointer;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:color .2s, border-color .2s, background .2s, transform .12s;
  }
  .ctrl:active{transform:scale(.96);}
  .ctrl.ghost{color:var(--ink-faint); border-color:transparent; background:transparent;}

  .seg-row{display:flex; align-items:center; gap:12px;}
  .seg-cap{font-size:10px; letter-spacing:.3em; color:var(--ink-faint);}
  .seg{
    display:flex; gap:4px; padding:4px;
    border:1px solid var(--line); border-radius:999px;
    background:var(--card);
  }
  .seg button{
    padding:7px 16px; border:none; border-radius:999px;
    background:transparent; color:var(--ink-faint);
    font-size:12px; letter-spacing:.18em; cursor:pointer;
    transition:color .2s, background .2s;
  }
  .seg button.on{background:rgba(227,197,138,.16); color:var(--gold);}

  .stats{
    font-size:11px; letter-spacing:.22em; color:var(--ink-faint);
    height:14px;
  }

  .hint{
    margin-top:2px; font-size:11px; letter-spacing:.1em; color:#7a6a4a;
    text-align:center; line-height:1.6;
  }
  .hint[hidden]{display:none;}

  .note{
    text-align:center; font-size:12px; letter-spacing:.24em; color:var(--ink-dim);
    line-height:2;
  }

  @media (max-height:640px){
    .ring-wrap{width:min(52vw,240px);}
    .presets{gap:8px;}
    .preset{padding:11px 0 9px;}
    body.phase-run .readout .time{font-size:clamp(1.3rem, 5vw, 1.8rem);}
  }
</style>
</head>

  var actx = null;
  function ac(){
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!actx) actx = new AC();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  function bell(freq, dur, vol){
    if (!S.sound) return;
    var c = ac(); if (!c) return;
    var t = c.currentTime;
    var master = c.createGain();
    master.gain.value = vol;
    master.connect(c.destination);

    var partials = [[1, 1], [2.76, .42], [5.40, .20], [8.93, .09], [13.3, .04]];
    partials.forEach(function(p, i){
      var o = c.createOscillator();
      var g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq * p[0], t);
      var life = dur * (1 - i * 0.11);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(p[1], t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(life, 0.2));
      o.connect(g); g.connect(master);
      o.start(t);
      o.stop(t + dur + 0.1);
    });

    var n = c.createOscillator(), ng = c.createGain();
    n.type = 'triangle';
    n.frequency.setValueAtTime(freq * 3.2, t);
    ng.gain.setValueAtTime(0.22 * vol, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    n.connect(ng); ng.connect(c.destination);
    n.start(t); n.stop(t + 0.08);
  }

  function tick(freq, dur, vol){
    if (!S.sound) return;
    var c = ac(); if (!c) return;
    var t = c.currentTime;
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function muyuStrike(c, time, vol){
    var osc  = c.createOscillator();
    var gain = c.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(850, time);
    osc.frequency.exponentialRampToValueAtTime(550, time + 0.08);
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(vol, time + 0.003);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.12);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(time); osc.stop(time + 0.15);
  }

      var raw = inp.value.replace(/[^0-9]/g, '');

      v = Math.min(CUSTOM_MAX, Math.max(CUSTOM_MIN, v));
      S.custom = v;

    inp.addEventListener('input',  function(){ markPreset(box); apply(false); });
    inp.addEventListener('focus',  function(){ ac(); markPreset(box); });
    inp.addEventListener('blur',   function(){ apply(true); saveDuration(); });

    var d = loadData(); d.breath = qi.on; saveData(d);
    buzz(8);
  });

  el.btnSound.addEventListener('click', function(){
    S.sound = !S.sound;
    el.btnSound.classList.toggle('off', !S.sound);
    el.btnSound.textContent = S.sound ? '◍' : '◌';
    if (S.sound) ac();
  });

  if (document.documentElement.requestFullscreen ||
      document.documentElement.webkitRequestFullscreen){
    el.btnFull.hidden = false;
    el.btnFull.addEventListener('click', function(){
      var d = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement){
        (d.requestFullscreen || d.webkitRequestFullscreen).call(d);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      }
    });
  }

  document.addEventListener('keydown', function(e){
    var act = document.activeElement;
    if (act && (act.tagName === 'INPUT' || act.tagName === 'TEXTAREA')) return;
    if (e.code === 'Space' || e.key === ' '){
      e.preventDefault();
      if (S.phase === 'idle') start();
      else if (S.phase === 'run') pause();
      else if (S.phase === 'paused') resume();
      else if (S.phase === 'done') { reset(); start(); }
    } else if (e.key === 'Escape'){
      if (S.phase !== 'idle') reset();
    }
  });

  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

  /* ============================================================
   *  2 分钟自动平滑视角轮换机制
   * ============================================================ */
  var VIEW_ORDER = ['front', 'angleL', 'back', 'angleR'];
  var autoViewTimer = null;

  function rotateNextView(){
    if (S.mode !== 'standing') return;
    var idx = VIEW_ORDER.indexOf(S.view);
    var nextIdx = (idx + 1) % VIEW_ORDER.length;
    setView(VIEW_ORDER[nextIdx]);
  }

  function startAutoViewRotation(){
    stopAutoViewRotation();
    if (S.mode === 'standing'){
      autoViewTimer = setInterval(rotateNextView, BREATH.viewInterval);
    }
  }

  function stopAutoViewRotation(){
    if (autoViewTimer){ clearInterval(autoViewTimer); autoViewTimer = null; }
  }

  /* ============================================================
   *  气机可视化渲染引擎
   * ============================================================ */
  var qi = {
    cv: null, ctx: null, figure: null,
    W: 0, H: 0, dpr: 1,
    on: true, running: false,
    t0: Date.now(), last: 0, pausedAt: 0, raf: 0,
    parts: [], mode: 'flow', retT: 0,
    routes: {}, fade: 1
  };

  function samplePath(id, n){
    var p = document.getElementById(id);
    if (!p || !p.getTotalLength) return null;
    try {
      var L = p.getTotalLength();
      if (!L) return null;
      var pts = [], i, q;
      for (i = 0; i <= n; i++){
        q = p.getPointAtLength(L * i / n);
        pts.push([q.x, q.y]);
      }
      return pts;
    } catch(e){ return null; }
  }

  function resample(pts, n){
    if (!pts || pts.length < 2) return null;
    var seg = [], total = 0, i;
    for (i = 1; i < pts.length; i++){
      var dx = pts[i][0] - pts[i-1][0], dy = pts[i][1] - pts[i-1][1];
      var d = Math.sqrt(dx*dx + dy*dy);
      seg.push(d); total += d;
    }
    if (!total) return null;
    var out = new Float32Array((n + 1) * 2);
    var step = total / n, si = 0, acc = 0;
    out[0] = pts[0][0]; out[1] = pts[0][1];
    for (i = 1; i <= n; i++){
      var target = step * i;
      while (si < seg.length && acc + seg[si] < target){ acc += seg[si]; si++; }
      if (si >= seg.length){
        out[i*2] = pts[pts.length-1][0]; out[i*2+1] = pts[pts.length-1][1];
        continue;
      }
      var k = (target - acc) / seg[si];
      out[i*2]   = pts[si][0] + (pts[si+1][0] - pts[si][0]) * k;
      out[i*2+1] = pts[si][1] + (pts[si+1][1] - pts[si][1]) * k;
    }
    return { pts: out, n: n };
  }

  function pointOn(route, u){
    if (!route) return { x: 180, y: 260 };
    var f = Math.min(Math.max(u, 0), 1) * route.n;
    var i = Math.floor(f), k = f - i;
    if (i >= route.n) return { x: route.pts[route.n*2], y: route.pts[route.n*2+1] };
    return {
      x: route.pts[i*2]     + (route.pts[(i+1)*2]     - route.pts[i*2])     * k,
      y: route.pts[i*2 + 1] + (route.pts[(i+1)*2 + 1] - route.pts[i*2 + 1]) * k
    };
  }

  function buildRoutes(){
    var N = 160;

    qi.routes.front = {
      noseIn     : resample(samplePath('sf_noseIn', 100), N),
      microInhale: resample(samplePath('sf_du', 100), N),
      microExhale: resample(samplePath('sf_ren', 100), N),
      armL       : resample(samplePath('sf_armL', 100), N),
      armR       : resample(samplePath('sf_armR', 100), N)
    };

    qi.routes.angleL = {
      noseIn     : resample(samplePath('sal_noseIn', 100), N),
      microInhale: resample(samplePath('sal_du', 100), N),
      microExhale: resample(samplePath('sal_ren', 100), N),
      armL       : resample(samplePath('sal_armL', 100), N),
      armR       : resample(samplePath('sal_armR', 100), N)
    };

    qi.routes.angleR = {
      noseIn     : resample(samplePath('sar_noseIn', 100), N),
      microInhale: resample(samplePath('sar_du', 100), N),
      microExhale: resample(samplePath('sar_ren', 100), N),
      armL       : resample(samplePath('sar_armL', 100), N),
      armR       : resample(samplePath('sar_armR', 100), N)
    };

    qi.routes.back = {
      noseIn     : resample(samplePath('sb_ren', 100), N),
      microInhale: resample(samplePath('sb_du', 100), N),
      microExhale: resample(samplePath('sb_ren', 100), N),
      armL       : resample(samplePath('sb_armL', 100), N),
      armR       : resample(samplePath('sb_armR', 100), N)
    };

    qi.routes.sitting = {
      noseIn     : resample(samplePath('sitNoseIn', 100), N),
      microInhale: resample(samplePath('sitDu', 100), N),
      microExhale: resample(samplePath('sitRen', 100), N),
      armL       : resample(samplePath('sitRen', 100), N),
      armR       : resample(samplePath('sitRen', 100), N)
    };
  }

  var spriteCache = {};
  function sprite(r, g, b){
    var k = (r >> 3) + '_' + (g >> 3) + '_' + (b >> 3);
    if (spriteCache[k]) return spriteCache[k];
    var s = 64, c = document.createElement('canvas');
    c.width = c.height = s;
    var ctx = c.getContext('2d');
    var rg = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    rg.addColorStop(0,    'rgba(' + r + ',' + g + ',' + b + ',1)');
    rg.addColorStop(0.35, 'rgba(' + r + ',' + g + ',' + b + ',0.45)');
    rg.addColorStop(1,    'rgba(' + r + ',' + g + ',' + b + ',0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, s, s);
    spriteCache[k] = c;
    return c;
  }

  function qiResize(){
    if (!qi.cv) return;
    var box = qi.figure.getBoundingClientRect();
    qi.W = box.width || 270;
    qi.H = box.height || 360;
    qi.dpr = Math.min(window.devicePixelRatio || 1, 2);
    qi.cv.width  = Math.round(qi.W * qi.dpr);
    qi.cv.height = Math.round(qi.H * qi.dpr);
    var s = (qi.W / VW) * qi.dpr;
    qi.ctx.setTransform(s, 0, 0, s, 0, 0);
  }

  function qiParts(){
    var d = currentPt().DANTIAN;
    qi.parts = [];
    for (var i = 0; i < BREATH.particles; i++){
      qi.parts.push({
        off : Math.random(),
        sp  : 0.82 + Math.random() * 0.45,
        lat : (Math.random() - 0.5) * 8,
        ang : Math.random() * Math.PI * 2,
        rad : 12 + Math.random() * 80,
        ph  : Math.random() * Math.PI * 2,
        sz  : 1.2 + Math.random() * 2.0,
        px  : d.x, py : d.y,
        px0 : d.x, py0: d.y
      });
    }
  }

  function breathNow(){
    var total = BREATH.inhale + BREATH.exhale;
    var el = ((Date.now() - qi.t0) % total + total) % total;
    var inhaling = el < BREATH.inhale;
    return {
      inhaling: inhaling,
      p: inhaling ? el / BREATH.inhale : (el - BREATH.inhale) / BREATH.exhale
    };
  }

  function ease(t){ return 0.5 - 0.5 * Math.cos(Math.PI * Math.min(Math.max(t, 0), 1)); }

  /* ============================================================
   *  Canvas 实时渲染
   * ============================================================ */
  function qiFrame(){
    if (!qi.running) return;
    var now = Date.now();
    var dt  = qi.last ? Math.min((now - qi.last) / 1000, 0.05) : 0.016;
    qi.last = now;

    var b = breathNow();
    var pEase = ease(b.p);
    var ctx = qi.ctx;
    var i, pt, a;

    if (qi.fade < 1) qi.fade = Math.min(1, qi.fade + dt / 0.4);

    var P = currentPt();
    var currentRoutes = (S.mode === 'sitting')
      ? qi.routes.sitting
      : (qi.routes[S.view] || qi.routes.front);

    var dim = (S.phase === 'idle' ? 0.45 : 1.0) * qi.fade;

    ctx.clearRect(0, 0, VW, VH);
    ctx.globalCompositeOperation = 'lighter';

    /* 模式 A：丹田呼吸 (鼻吸微合，鼻呼微涨) */
    if (S.mind === 'dantian'){
      var radius, dtAlpha, coreColor;
      if (b.inhaling){
        radius = 38 - pEase * 20;
        dtAlpha = (0.55 + pEase * 0.45) * dim;
        coreColor = '255, 175, 75';
      } else {
        radius = 18 + pEase * 42;
        dtAlpha = (0.95 - pEase * 0.45) * dim;
        coreColor = '245, 198, 110';
      }

      var gOuter = ctx.createRadialGradient(P.DANTIAN.x, P.DANTIAN.y, 2, P.DANTIAN.x, P.DANTIAN.y, radius * 2.0);
      gOuter.addColorStop(0,   'rgba(255,255,255,' + (dtAlpha * 0.9) + ')');
      gOuter.addColorStop(0.25, 'rgba(' + coreColor + ',' + (dtAlpha * 0.75) + ')');
      gOuter.addColorStop(0.65, 'rgba(230,160,50,' + (dtAlpha * 0.25) + ')');
      gOuter.addColorStop(1,   'rgba(230,160,50,0)');
      ctx.fillStyle = gOuter;
      ctx.beginPath();
      ctx.arc(P.DANTIAN.x, P.DANTIAN.y, radius * 2.0, 0, Math.PI * 2);
      ctx.fill();

      var coreR = b.inhaling ? (8 - pEase * 2.5) : (5.5 + pEase * 3.0);
      var gCore = ctx.createRadialGradient(P.DANTIAN.x, P.DANTIAN.y, 0, P.DANTIAN.x, P.DANTIAN.y, coreR);
      gCore.addColorStop(0,   'rgba(255,255,255,' + (0.95 * dim) + ')');
      gCore.addColorStop(0.4, 'rgba(255,220,130,' + (0.85 * dim) + ')');
      gCore.addColorStop(1,   'rgba(255,140,30,0)');
      ctx.fillStyle = gCore;
      ctx.beginPath();
      ctx.arc(P.DANTIAN.x, P.DANTIAN.y, coreR, 0, Math.PI * 2);
      ctx.fill();

      if (S.mode === 'standing'){
        var viewInfo = VIEW_MODELS[S.view] || VIEW_MODELS.front;
        var bc = viewInfo.ballCenter;

        var ballScale = b.inhaling ? (1.06 - pEase * 0.18) : (0.88 + pEase * 0.24);
        var curBallR = 38 * ballScale;

        var ballAlpha = b.inhaling ? (0.22 - pEase * 0.08) : (0.14 + pEase * 0.30);
        var gBall = ctx.createRadialGradient(bc.x, bc.y, 2, bc.x, bc.y, curBallR * 1.5);
        gBall.addColorStop(0,   'rgba(255,245,215,' + (ballAlpha * 1.2 * dim) + ')');
        gBall.addColorStop(0.35,'rgba(240,198,116,' + (ballAlpha * 0.8 * dim) + ')');
        gBall.addColorStop(0.7, 'rgba(227,185,100,' + (ballAlpha * 0.25 * dim) + ')');
        gBall.addColorStop(1,   'rgba(240,198,116,0)');
        ctx.fillStyle = gBall;
        ctx.beginPath();
        ctx.arc(bc.x, bc.y, curBallR * 1.5, 0, Math.PI * 2);
        ctx.fill();

        var aRing = (0.12 + (b.inhaling ? (1-pEase)*0.1 : pEase*0.28)) * dim;
        ctx.lineWidth = 1.8 + (b.inhaling ? 0 : pEase * 2.2);
        ctx.strokeStyle = 'rgba(240,198,116,' + aRing + ')';
        ctx.beginPath();
        ctx.ellipse(bc.x, bc.y, (bc.rx + (b.inhaling ? -pEase*4 : pEase*12)), (bc.ry + (b.inhaling ? -pEase*2 : pEase*8)), 0, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        var aSitRing = (0.14 + (b.inhaling ? (1-pEase)*0.1 : pEase*0.3)) * dim;
        ctx.lineWidth = 2.0 + (b.inhaling ? 0 : pEase * 2.0);
        ctx.strokeStyle = 'rgba(240,198,116,' + aSitRing + ')';
        ctx.beginPath();
        ctx.ellipse(180, 420, 126 + (b.inhaling ? 0 : pEase * 12), 26 + (b.inhaling ? 0 : pEase * 4), 0, 0, Math.PI * 2);
        ctx.stroke();

        var gSeal = ctx.createRadialGradient(180, 326, 1, 180, 326, 30);
        gSeal.addColorStop(0, 'rgba(255,245,215,' + (0.35 * (b.inhaling ? (1-pEase) : pEase) * dim) + ')');
        gSeal.addColorStop(1, 'rgba(240,198,116,0)');
        ctx.fillStyle = gSeal;
        ctx.beginPath();
        ctx.arc(180, 326, 30, 0, Math.PI * 2);
        ctx.fill();
      }

      var sprWarm = sprite(255, 215, 130);
      var sprBright = sprite(255, 245, 220);
      var sprCyanBreath = sprite(130, 230, 200);

      var noseRoute = currentRoutes ? currentRoutes.noseIn : null;

      for (i = 0; i < qi.parts.length; i++){
        pt = qi.parts[i];

        if (b.inhaling){
          if (i % 2 === 0 && noseRoute){
            var uNose = (pEase * pt.sp + pt.off * 0.3) % 1;
            var posN = pointOn(noseRoute, uNose);
            pt.px = posN.x + Math.sin(now * 0.003 + pt.ph) * 1.5;
            pt.py = posN.y;
            a = (0.45 + pEase * 0.5) * dim;
          } else {
            var curRad = pt.rad * (1 - pEase * 0.85);
            var ang = pt.ang + (1 - pEase) * 1.2;
            pt.px = P.DANTIAN.x + Math.cos(ang) * curRad;
            pt.py = P.DANTIAN.y + Math.sin(ang) * (curRad * 0.65);
            a = (0.35 + pEase * 0.55) * dim;
          }
        } else {
          if (i % 2 === 0 && S.mode === 'standing' && currentRoutes){
            var rArm = (i % 4 === 0) ? currentRoutes.armL : currentRoutes.armR;
            if (rArm){
              var uArm = (pEase * pt.sp + pt.off * 0.3) % 1;
              var posA = pointOn(rArm, uArm);
              pt.px = posA.x + Math.sin(now * 0.003 + pt.ph) * pt.lat * 0.35;
              pt.py = posA.y;
            }
          } else {
            var outRad = 15 + pEase * (pt.rad * 1.3);
            pt.px = P.DANTIAN.x + Math.cos(pt.ang) * outRad;
            pt.py = P.DANTIAN.y + Math.sin(pt.ang) * (outRad * 0.75);
          }
          a = (0.85 - pEase * 0.55) * dim;
        }
        pt.px0 = pt.px; pt.py0 = pt.py;

        var sz = pt.sz * (1.2 + (b.inhaling ? (1-pEase)*0.4 : pEase*0.6));
        ctx.globalAlpha = Math.min(1, Math.max(0, a));
        ctx.drawImage((b.inhaling && i % 2 === 0 ? sprCyanBreath : (i % 3 === 0 ? sprBright : sprWarm)), pt.px - sz/2, pt.py - sz/2, sz, sz);
      }

    /* 模式 B：小周天流转 */
    } else {
      var isUp = b.inhaling;
      var sprCyan = sprite(130, 215, 255);
      var sprGold = sprite(255, 210, 110);
      var activeSpr = isUp ? sprCyan : sprGold;

      var baihuiGlow = isUp ? pEase : (1 - pEase * 0.7);
      if (baihuiGlow > 0.05){
        var gB = ctx.createRadialGradient(P.BAIHUI.x, P.BAIHUI.y, 0, P.BAIHUI.x, P.BAIHUI.y, 24);
        gB.addColorStop(0,   'rgba(255,255,255,' + (0.45 * baihuiGlow * dim) + ')');
        gB.addColorStop(0.5, 'rgba(120,210,255,' + (0.25 * baihuiGlow * dim) + ')');
        gB.addColorStop(1,   'rgba(120,210,255,0)');
        ctx.fillStyle = gB;
        ctx.beginPath();
        ctx.arc(P.BAIHUI.x, P.BAIHUI.y, 24, 0, Math.PI * 2);
        ctx.fill();
      }

      var dtGlow = isUp ? (1 - pEase * 0.6) : (0.35 + pEase * 0.65);
      var gDT = ctx.createRadialGradient(P.DANTIAN.x, P.DANTIAN.y, 1, P.DANTIAN.x, P.DANTIAN.y, 28);
      gDT.addColorStop(0,   'rgba(255,255,255,' + (0.50 * dtGlow * dim) + ')');
      gDT.addColorStop(0.4, 'rgba(255,200,90,' + (0.35 * dtGlow * dim) + ')');
      gDT.addColorStop(1,   'rgba(255,200,90,0)');
      ctx.fillStyle = gDT;
      ctx.beginPath();
      ctx.arc(P.DANTIAN.x, P.DANTIAN.y, 28, 0, Math.PI * 2);
      ctx.fill();

      var aTanzhong = (0.2 + 0.3 * Math.sin(pEase * Math.PI)) * dim;
      var gT = ctx.createRadialGradient(P.TANZHONG.x, P.TANZHONG.y, 1, P.TANZHONG.x, P.TANZHONG.y, 20);
      gT.addColorStop(0,   'rgba(255,255,255,' + (0.35 * aTanzhong) + ')');
      gT.addColorStop(0.6, 'rgba(150,220,255,' + (0.20 * aTanzhong) + ')');
      gT.addColorStop(1,   'rgba(150,220,255,0)');
      ctx.fillStyle = gT;
      ctx.beginPath();
      ctx.arc(P.TANZHONG.x, P.TANZHONG.y, 20, 0, Math.PI * 2);
      ctx.fill();

      var activeRoute = isUp ? (currentRoutes ? currentRoutes.microInhale : null) : (currentRoutes ? currentRoutes.microExhale : null);
      var trailVis = Math.pow(Math.sin(Math.PI * Math.min(Math.max(b.p, 0), 1)), 0.65);

      if (activeRoute){
        for (i = 0; i < qi.parts.length; i++){
          pt = qi.parts[i];
          var u = (pEase * pt.sp + pt.off * 0.45) % 1;
          var pos = pointOn(activeRoute, u);

          var wob = Math.sin(u * Math.PI * 4 + pt.ph + now * 0.002) * (pt.lat * 0.28);
          pt.px = pos.x + wob;
          pt.py = pos.y;
          pt.px0 = pt.px; pt.py0 = pt.py;

          var pAlpha = (0.35 + trailVis * 0.6) * dim;
          var pSize  = pt.sz * (1.1 + trailVis * 0.6) * 2.2;
          ctx.globalAlpha = Math.min(1, Math.max(0, pAlpha));
          ctx.drawImage(activeSpr, pt.px - pSize/2, pt.py - pSize/2, pSize, pSize);
        }
      }
    }

    if (qi.mode === 'return'){
      qi.retT += dt;
      var k = Math.min(1, qi.retT / 2.2);
      var ke = ease(k);
      var fade = k < 0.65 ? 1 : 1 - (k - 0.65) / 0.35;
      var sprRet = sprite(255, 235, 180);
      for (i = 0; i < qi.parts.length; i++){
        pt = qi.parts[i];
        pt.px = pt.px0 + (P.DANTIAN.x - pt.px0) * ke;
        pt.py = pt.py0 + (P.DANTIAN.y - pt.py0) * ke;
        var s2 = pt.sz * (1 - ke * 0.5) * 3.0;
        ctx.globalAlpha = Math.max(0, 0.6 * fade);
        ctx.drawImage(sprRet, pt.px - s2/2, pt.py - s2/2, s2, s2);
      }
      var rRet = 32 * (1 - ke * 0.75);
      var gRet = ctx.createRadialGradient(P.DANTIAN.x, P.DANTIAN.y, 1, P.DANTIAN.x, P.DANTIAN.y, rRet);
      gRet.addColorStop(0,   'rgba(255,255,255,' + (0.6 * fade) + ')');
      gRet.addColorStop(0.4, 'rgba(255,200,100,' + (0.35 * fade) + ')');
      gRet.addColorStop(1,   'rgba(255,200,100,0)');
      ctx.fillStyle = gRet;
      ctx.beginPath();
      ctx.arc(P.DANTIAN.x, P.DANTIAN.y, rRet, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (k >= 1){ qiStop(); return; }
      qi.raf = requestAnimationFrame(qiFrame);
      return;
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    qi.raf = requestAnimationFrame(qiFrame);
  }

  function qiStart(){
    if (!qi.on || !qi.ctx) return;
    qi.mode  = 'flow';
    qi.retT  = 0;
    qi.t0    = Date.now();
    qi.last  = 0;
    if (!qi.parts.length) qiParts();
    if (!qi.routes.front) buildRoutes();
    if (!qi.running){ qi.running = true; qi.raf = requestAnimationFrame(qiFrame); }
  }

  function qiPause(){
    qi.running  = false;
    qi.pausedAt = Date.now();
    if (qi.raf){ cancelAnimationFrame(qi.raf); qi.raf = 0; }
  }

  function qiResume(){
    if (!qi.on || !qi.ctx || qi.running) return;
    qi.t0 += Date.now() - qi.pausedAt;
    qi.last = 0;
    qi.running = true;
    qi.raf = requestAnimationFrame(qiFrame);
  }

  function qiFinish(){
    if (!qi.on || !qi.running){ qiStop(); return; }
    qi.mode = 'return';
    qi.retT = 0;
    qi.last = 0;
  }

  function qiStop(){
    qi.running = false;
    if (qi.raf){ cancelAnimationFrame(qi.raf); qi.raf = 0; }
    if (qi.ctx) qi.ctx.clearRect(0, 0, VW, VH);
  }

  function qiSetOn(v){
    qi.on = !!v;
    el.btnBreath.classList.toggle('off', !qi.on);
    el.body.classList.toggle('qi-on', qi.on);
    el.mindSel.classList.toggle('hidden', !qi.on);
    if (!qi.on){ qiStop(); stopAutoViewRotation(); }
    else { qiStart(); if (S.phase === 'prep' || S.phase === 'run') startAutoViewRotation(); }
  }

  /* ---------- 切换视角 / 模式 / 意念 ---------- */
  function updateFigureDisplay(){
    var isSitting = (S.mode === 'sitting');
    document.getElementById('svgSitting').classList.toggle('off', !isSitting);

    var standSvgs = {
      front : document.getElementById('svgStandFront'),
      angleL: document.getElementById('svgStandAngleL'),
      angleR: document.getElementById('svgStandAngleR'),
      back  : document.getElementById('svgStandBack')
    };

    for (var k in standSvgs){
      if (standSvgs[k]){
        standSvgs[k].classList.toggle('off', isSitting || S.view !== k);
      }
    }
  }

  function setView(vKey){
    if (!VIEW_MODELS[vKey]) return;
    S.view = vKey;
    updateFigureDisplay();
    qi.fade = 0;
    var d = loadData(); d.view = vKey; saveData(d);
  }

  function setMode(m){
    if (!MODES[m]) return;
    S.mode = m;
    el.body.classList.toggle('mode-sitting', m === 'sitting');
    Array.prototype.forEach.call(el.modeSel.children, function(b){
      b.classList.toggle('on', b.dataset.mode === m);
    });

    updateFigureDisplay();
    breathShown = null;
    qi.fade = 0;
    if (tipId) tipsStart();
    if (m === 'standing' && (S.phase === 'prep' || S.phase === 'run')){
      startAutoViewRotation();
    } else {
      stopAutoViewRotation();
    }
    var d = loadData(); d.mode = m; saveData(d);
  }

  function setMind(mindKey){
    if (!MIND_CONFIG[mindKey]) return;
    S.mind = mindKey;
    el.body.classList.toggle('mind-microcosm', mindKey === 'microcosm');
    el.body.classList.toggle('mind-dantian', mindKey === 'dantian');
    Array.prototype.forEach.call(el.mindSel.children, function(b){
      b.classList.toggle('on', b.dataset.mind === mindKey);
    });

    breathShown = null;
    qi.fade = 0;
    if (tipId) tipsStart();
    var d = loadData(); d.mind = mindKey; saveData(d);
  }

  /* ---------- 大字体核心口诀轮换 ---------- */
  var tipIdx = 0, tipId = null, tipGen = 0;

  function tipShow(i){
    if (S.phase !== 'run' && S.phase !== 'paused') return;
    var m = mode();
    var list = (m.tips && m.tips[S.mind]) ? m.tips[S.mind] : (m.tips.dantian || []);
    var gen = ++tipGen;
    el.time.style.opacity = 0;
    el.time.style.transform = 'translateY(6px)';
    setTimeout(function(){
      if (gen !== tipGen || (S.phase !== 'run' && S.phase !== 'paused')) return;
      el.time.textContent = list[i % list.length];
      el.time.style.opacity = 1;
      el.time.style.transform = 'translateY(0)';
    }, 400);
  }

  function tipsStart(){
    tipsStop();
    tipIdx = 0;
    if (S.phase === 'run') tipShow(0);
    tipId = setInterval(function(){
      tipIdx++;
      if (S.phase === 'run') tipShow(tipIdx);
    }, BREATH.tipsEvery);
  }

  function tipsStop(){
    if (tipId) clearInterval(tipId);
    tipId = null;
    tipGen++;
  }

  window.addEventListener('resize', qiResize);
  window.addEventListener('orientationchange', function(){ setTimeout(qiResize, 250); });

  /* ============================================================
   *  PWA 配置
   * ============================================================ */
  function makeIcon(size){
    var cv = document.createElement('canvas');
    cv.width = cv.height = size;
    var g = cv.getContext('2d');
    g.fillStyle = '#0a0c0d';
    g.fillRect(0, 0, size, size);
    g.strokeStyle = '#e3c58a';
    g.lineWidth = size * 0.035;
    g.beginPath();
    g.arc(size / 2, size / 2, size * 0.28, 0, Math.PI * 2);
    g.stroke();
    g.fillStyle = '#e3c58a';
    g.beginPath();
    g.arc(size / 2, size / 2, size * 0.075, 0, Math.PI * 2);
    g.fill();
    return cv.toDataURL('image/png');
  }

  try {
    var i192 = makeIcon(192), i512 = makeIcon(512);
    var manifest = {
      name: '站桩 · Zen Timer',
      short_name: '站桩',
      start_url: '.',
      display: 'standalone',
      background_color: '#0a0c0d',
      theme_color: '#0a0c0d',
      orientation: 'portrait',
      icons: [
        { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
      ]
    };
    var url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
    var link = document.createElement('link');
    link.rel = 'manifest';
    link.href = url;
    document.head.appendChild(link);

    var al = document.createElement('link');
    al.rel = 'apple-touch-icon';
    al.href = i192;
    document.head.appendChild(al);
  } catch(e){}

  /* ---------- 启动初始化 ---------- */
  var saved = loadData();
  S.ending   = saved.ending;
  S.custom   = saved.custom;
  S.duration = saved.duration;
  S.view     = saved.view || 'front';
  setMode(saved.mode);
  setMind(saved.mind);
  setView(S.view);

  qi.figure = document.getElementById('qiFigure');
  qi.cv     = document.getElementById('qi');
  qi.ctx    = qi.cv.getContext('2d');
  qiResize();
  buildRoutes();
  qiParts();
  qiSetOn(saved.breath);

  buildPresets();
  paintSeg();
  paintStats();
  el.ring.style.strokeDasharray    = C;
  el.ring.style.strokeDashoffset   = C;
  showDuration();
})();
</script>
</body>
</html>
