<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSA 加密解密工具 - Web Crypto</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --radius: 12px;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            line-height: 1.6;
        }

        /* --- Navbar --- */
        .navbar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; height: 64px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .nav-logo { font-weight: 700; font-size: 1.2rem; color: var(--primary); text-decoration: none; }
        .nav-links { display: flex; gap: 20px; }
        .nav-link { text-decoration: none; color: var(--text-sub); font-weight: 500; font-size: 0.95rem; transition: color 0.2s; }
        .nav-link:hover { color: var(--primary); }
        .nav-link.active { color: var(--primary); font-weight: 600; }
        @media (max-width: 768px) { .nav-links { display: none; } }

        /* --- Content --- */
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { color: var(--text-main); text-align: center; margin-bottom: 20px; font-size: 2rem; }

        .card {
            background: var(--card); padding: 30px; border-radius: var(--radius);
            box-shadow: var(--shadow-lg); margin-bottom: 30px; border: 1px solid var(--border);
        }
        
        .flex-row { display: flex; gap: 15px; align-items: end; margin-bottom: 15px; flex-wrap: wrap; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .input-wrapper { flex: 1; }
        label { display: block; font-weight: 600; font-size: 0.9em; margin-bottom: 6px; color: var(--text-sub); }

        input[type="text"], select, textarea {
            width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 14px; box-sizing: border-box; background: #fff; color: var(--text-main);
            font-family: monospace; resize: vertical; transition: border-color 0.2s, box-shadow 0.2s;
        }
        textarea { min-height: 120px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        .btn { 
            padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; 
            transition: all 0.2s; font-size: 0.95rem; height: 42px; display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-block { width: 100%; font-size: 1.1rem; padding: 12px; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; background: #9ca3af; }

        .status-bar { margin-top: 15px; font-size: 0.9em; min-height: 1.5em; font-weight: 500; }
        .text-success { color: #22c55e; }
        .text-error { color: #ef4444; }
        .text-warn { color: #f59e0b; }
        .result-box { background: #f1f5f9; border: 1px solid var(--border); cursor: pointer; }
        .error-banner { background: #fee2e2; color: #991b1b; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #f87171; display: none; text-align: center; font-weight: 600; }
        .divider { height: 1px; background: var(--border); margin: 25px 0; }
    </style>
</head>
<body data-i18n-title-key="rsa.title">

<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="nav-logo"><span data-i18n="nav.logo">🛡️ 安全工具箱</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-link" data-i18n="nav.home">首页</a>
            <a href="watermark.html" class="nav-link" data-i18n="nav.watermark">在线水印</a>
            <a href="dns.html" class="nav-link" data-i18n="nav.dns">DNS查询</a>
            <a href="base64.html" class="nav-link" data-i18n="nav.base64">Base64</a>
            <a href="fingerprint.html" class="nav-link" data-i18n="nav.fingerprint">指纹检测</a>
            <a href="qr-tool.html" class="nav-link" data-i18n="nav.qrcode">二维码</a>
            <a href="tools.html" class="nav-link" data-i18n="nav.allTools">全部工具</a>
        </div>
    </div>
</nav>

<div class="container">
    <h1 data-i18n="rsa.h1">RSA 加密/解密工具</h1>
    
    <div id="envWarning" class="error-banner" data-i18n="rsa.httpsErr">
        ❌ 错误：Web Crypto API 需要 HTTPS 或 localhost 环境。
    </div>
    
    <div class="card">
        <div class="flex-row">
            <div class="input-wrapper" style="flex: 0 0 auto; width: 150px;">
                <label for="keySize" data-i18n="rsa.keyBits">密钥位数</label>
                <select id="keySize">
                    <option value="2048" selected>2048 bits</option>
                    <option value="3072">3072 bits</option>
                    <option value="4096">4096 bits</option>
                </select>
            </div>
            <div class="input-wrapper" style="flex: 0 0 auto; width: 150px;">
                <label for="keyFormat" data-i18n="rsa.format">格式</label>
                <select id="keyFormat" disabled title="PEM">
                    <option value="pem" selected>PEM (Base64)</option>
                </select>
            </div>
            <div class="input-wrapper">
                <button id="generateKeyBtn" class="btn btn-primary" style="width: 100%;" data-i18n="rsa.genBtn">⚡ 生成新密钥对</button>
            </div>
        </div>
        <div id="keyStatus" class="status-bar text-success" style="margin-bottom: 15px; margin-top: -10px;"></div>

        <div class="grid-2">
            <div class="input-wrapper">
                <label for="pemPublicKey" data-i18n="rsa.pubKey">公钥 (Public Key) - 用于加密</label>
                <textarea id="pemPublicKey" placeholder="SPKI PEM..."></textarea>
            </div>
            <div class="input-wrapper">
                <label for="pemPrivateKey" data-i18n="rsa.privKey">私钥 (Private Key) - 用于解密</label>
                <textarea id="pemPrivateKey" placeholder="PKCS#8 PEM..."></textarea>
            </div>
        </div>

        <div class="divider"></div>

        <div class="input-wrapper">
            <label for="contentInput" data-i18n="rsa.dataLabel">数据内容 (自动识别加密/解密)</label>
            <textarea id="contentInput" rows="6" placeholder="..."></textarea>
        </div>
    </div>
    <footer data-i18n-html="footer.standard" style="text-align:center;color:#94a3b8;font-size:0.85rem;margin-top:40px;">© 2026 安全工具箱</footer>
</div>

<link rel="stylesheet" href="css/site-i18n.css">
<script src="js/site-i18n-strings.js"></script>
<script src="js/i18n-extra-strings.js"></script>
<script src="js/site-i18n-core.js"></script>
<script>SiteI18n.init('rsa');</script>
</body>
</html>
